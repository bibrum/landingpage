<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philipp Rumm | Dozent für Informatik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f7fa;
        }

        header {
            background: linear-gradient(135deg, #0f4c81, #0066cc);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        header h2 {
            font-weight: normal;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: white;
            color: #0066cc;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #e6eef8;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        section {
            margin-bottom: 60px;
        }

        h3 {
            margin-bottom: 20px;
            color: #0f4c81;
            font-size: 2rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .card h4 {
            margin-bottom: 10px;
            color: #0066cc;
        }

        ul {
            padding-left: 20px;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .highlight {
            color: #0066cc;
            font-weight: bold;
        }

        .contact-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .contact-box p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Philipp Rumm</h1>
